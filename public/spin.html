<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin Wheel 🎡</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="/index.html" class="brand"><span id="siteBrandEmoji">🌈</span><img id="siteBrandLogo" class="brand-logo" style="display:none;" alt="Logo"><span id="siteBrandText">Ganjaran BM</span></a>
  <div class="breadcrumbs">
    <a href="/leaderboard.html">🏆 Leaderboard</a>
    <a href="/kumpulan.html">👨‍👩‍👧‍👦 Kumpulan</a>
    <a href="/kelas.html">🏫 Pengurusan Kelas</a>
    <a href="/spin.html" class="active">🎡 Spin Wheel</a>
    <a href="/hadiah.html">🎁 Hadiah</a>
  </div>
</nav>

<div class="container">
  <h1 class="page-title">🎡 Spin Wheel Ajaib</h1>
  <p class="page-subtitle">Pilih kelas, kemudian tekan pada gambar untuk mula spin!</p>

  <div class="class-selector" id="classSelector"></div>

  <div class="card spin-stage" id="spinStage">
    <div class="spin-display-frame" id="spinFrame" onclick="handleFrameClick()">
      <img id="spinImg" src="" alt="">
      <div class="spin-tap-hint" id="spinTapHint">👆 Tekan untuk Spin!</div>
    </div>
    <button class="spin-fullscreen-btn" onclick="toggleFullscreen()">🔍 Skrin Penuh</button>
    <div id="spinCount" style="margin-top:10px; font-size:13px; opacity:.6;"></div>
  </div>

  <p style="text-align:center; margin-top:16px; opacity:.6; font-size:13px;">
    💡 Nak tambah/urus gambar spin wheel? Pergi ke <a href="/kelas.html">Pengurusan Kelas</a> → pilih kelas → bahagian "Set Gambar Spin Wheel"
  </p>
</div>

<script src="/js/api.js"></script>
<script src="/js/sound.js"></script>
<script src="/js/site.js"></script>
<script src="/js/spin.js"></script>
</body>
</html>
